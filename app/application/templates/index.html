{% extends 'base.html' %}{% block content %}<p>Your private text documents. Maximum file size: 5 MiB.</p><form method="post" action="/upload" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required maxlength="120"></label><label>Description<textarea name="description" maxlength="1000"></textarea></label><label>UTF-8 text file<input type="file" name="file" accept=".txt" required></label><button>Upload</button></form>{% for d in documents %}<article><h2>{{ d.title }}</h2><p>{{ d.description }}</p><p>{{ d.filename }} · {{ d.size }} bytes · {{ d.created_at }}</p><a href="/documents/{{ d.id }}/download">Download</a><form method="post" action="/documents/{{ d.id }}/delete"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Delete permanently</button></form></article>{% else %}<p>No documents yet.</p>{% endfor %}<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Logout</button></form>{% endblock %}
