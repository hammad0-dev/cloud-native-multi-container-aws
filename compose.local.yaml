services:
  app:
    environment:
      DB_HOST: mysql
      DB_TLS: "false"
      COOKIE_SECURE: "false"
      S3_ENDPOINT_URL: http://s3:5000
      AWS_ACCESS_KEY_ID: local-testing-only
      AWS_SECRET_ACCESS_KEY: local-testing-only
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      mysql: {condition: service_healthy}
      s3: {condition: service_healthy}
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: vault
      MYSQL_USER: vault
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
    secrets: [db_password, mysql_root]
    volumes: [mysql-data:/var/lib/mysql]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30
  s3:
    image: motoserver/moto:5.1.18
    environment: {MOTO_PORT: "5000"}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 5s
      timeout: 5s
      retries: 20
secrets:
  mysql_root: {file: "${SECRETS_DIR:-./.secrets}/mysql_root"}
volumes:
  mysql-data:
